services:
  - type: web
    name: zenith-siz-backend
    runtime: node
    # Instance type (NÃO confundir com o plano do workspace, que também se chama "Pro").
    # O serviço é Blueprint managed: o valor daqui sobrescreve o painel a cada sync.
    # Free hiberna após 15 min e essa hibernação era o gatilho das edições perdidas
    # entre expedição e comercial. Nunca voltar para free.
    plan: pro
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://lacres.com.br,https://www.lacres.com.br,https://zenithlacres.com.br,https://www.zenithlacres.com.br,http://localhost:5173,http://localhost:8080
